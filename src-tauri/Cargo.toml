[package]
name = "prime-workbench"
version = "0.1.0"
description = "Prime Workbench — local-first research and coding environment"
edition = "2021"

[lib]
name = "prime_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
ignore = "0.4"
notify = "8"
# No network git: dropping https/ssh removes the openssl/libssh2 chain entirely.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
trash = "5"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
ulid = "1"
sha2 = "0.10"
zeroize = "1.8"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
